name: TaalAvontuur
options:
  bundleIdPrefix: com.taalavontuur
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: TaalAvontuur/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_XR_DESIGNED_FOR: NO
targets:
  TaalAvontuur:
    type: application
    platform: iOS
    sources:
      - path: TaalAvontuur
        excludes:
          - Resources
    resources:
      - path: TaalAvontuur/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taalavontuur.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
